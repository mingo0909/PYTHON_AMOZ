<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آموزش جامع پایتون · فصل اول + گنجینه</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0f14; color: #e4e9f0; padding: 0; min-height: 100vh; line-height: 1.9; }
        
        .header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem; padding: 1rem 2rem; background: #111a22; border-bottom: 2px solid #2a323d; position: sticky; top: 0; z-index: 100; }
        .logo { display: flex; align-items: center; gap: 0.6rem; font-size: 1.4rem; font-weight: 700; color: #ffd866; }
        .logo i { color: #4b9eff; font-size: 1.8rem; }
        .badge { background: #2a323d; padding: 0.3rem 1rem; border-radius: 40px; font-size: 0.75rem; color: #b0c7e0; display: flex; align-items: center; gap: 0.5rem; }
        .badge i { color: #4b9eff; }
        .badge .lib-count { background: #1a2a3a; padding: 0.05rem 0.5rem; border-radius: 20px; font-size: 0.6rem; color: #6eb5ff; }
        .sidebar-toggle { display: none; background: #1a2a3a; border: none; color: #b0c7e0; font-size: 1.5rem; padding: 0.3rem 0.8rem; border-radius: 8px; cursor: pointer; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 200; }
        .sidebar-overlay.open { display: block; }
        
        .sidebar { position: fixed; top: 0; right: 0; width: 360px; height: 100vh; background: #0f1820; border-left: 1px solid #2a323d; overflow-y: auto; padding: 1.2rem 1rem; z-index: 300; transform: translateX(0); transition: transform 0.3s ease; display: flex; flex-direction: column; gap: 0.5rem; }
        .sidebar.closed { transform: translateX(100%); }
        .sidebar-close { display: none; position: absolute; left: 0.8rem; top: 0.8rem; background: none; border: none; color: #b0c7e0; font-size: 1.5rem; cursor: pointer; }
        .sidebar h3 { color: #ffd866; font-size: 1.1rem; display: flex; align-items: center; gap: 0.6rem; border-bottom: 1px solid #2a3645; padding-bottom: 0.6rem; margin-bottom: 0.3rem; flex-shrink: 0; }
        .sidebar h3 i { color: #4b9eff; }
        .sidebar-search { width: 100%; padding: 0.5rem 0.8rem; background: #0a121a; border: 1px solid #1f2a38; border-radius: 10px; color: #e4e9f0; font-size: 0.85rem; margin-bottom: 0.5rem; flex-shrink: 0; }
        .sidebar-search:focus { outline: none; border-color: #4b9eff; }
        .sidebar-tabs { display: flex; gap: 0.3rem; margin-bottom: 0.5rem; flex-shrink: 0; }
        .sidebar-tabs button { flex: 1; padding: 0.45rem; background: #0a121a; border: 1px solid #1f2a38; border-radius: 8px; color: #6a8aa8; font-size: 0.75rem; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .sidebar-tabs button:hover { background: #1a2533; color: #b7cbe5; }
        .sidebar-tabs button.active { background: #1a2a3a; border-color: #4b9eff; color: #4b9eff; }
        .lesson-list { display: flex; flex-direction: column; gap: 0.2rem; overflow-y: auto; flex: 1; }
        .lesson-item { background: transparent; border: none; color: #b7cbe5; padding: 0.4rem 0.7rem; border-radius: 8px; text-align: right; font-size: 0.82rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 0.5rem; font-weight: 500; border: 1px solid transparent; width: 100%; }
        .lesson-item:hover { background: #1a2533; border-color: #2a3a4a; }
        .lesson-item.active { background: #1a2533; border-color: #ffd866; color: #fff; }
        .lesson-item i { color: #4b9eff; width: 1.2rem; font-size: 0.8rem; }
        .lesson-item .num { color: #6a8aa8; font-size: 0.6rem; margin-left: auto; background: #0f1a25; padding: 0.05rem 0.4rem; border-radius: 40px; }
        .sidebar-footer { margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid #1a2a3a; font-size: 0.6rem; color: #5a6a7a; text-align: center; flex-shrink: 0; }
        
        .library-list { display: flex; flex-direction: column; gap: 0.4rem; overflow-y: auto; flex: 1; }
        .library-item { padding: 0.5rem 0.7rem; background: #0a121a; border-radius: 8px; border: 1px solid #1a2533; font-size: 0.72rem; transition: 0.2s; cursor: default; }
        .library-item:hover { background: #1a2533; border-color: #2a3a4a; }
        .library-item .lib-header-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.25rem; }
        .library-item .lib-name { color: #ffd866; font-weight: 600; font-size: 0.82rem; direction: ltr; }
        .library-item .lib-cat { font-size: 0.5rem; padding: 0.08rem 0.4rem; border-radius: 10px; background: #1a2a3a; color: #4b9eff; white-space: nowrap; margin-right: auto; }
        .library-item .lib-desc { color: #8a9aaa; font-size: 0.68rem; line-height: 1.7; }
        .library-item .lib-usage { color: #81c995; font-size: 0.62rem; background: #0a1815; padding: 0.25rem 0.45rem; border-radius: 4px; margin-top: 0.3rem; direction: ltr; text-align: left; font-family: 'Consolas', monospace; }
        .lib-stats { color: #6a8aa8; font-size: 0.6rem; text-align: center; margin: 0.2rem 0; flex-shrink: 0; }
        .lib-search-box { display: flex; gap: 0.3rem; flex-shrink: 0; }
        .lib-search-box input { flex: 1; padding: 0.3rem 0.6rem; background: #0a121a; border: 1px solid #1f2a38; border-radius: 8px; color: #e4e9f0; font-size: 0.7rem; }
        .lib-search-box input:focus { outline: none; border-color: #4b9eff; }
        .lib-search-box select { padding: 0.3rem 0.4rem; background: #0a121a; border: 1px solid #1f2a38; border-radius: 8px; color: #b7cbe5; font-size: 0.65rem; cursor: pointer; }
        
        .main-content { margin-right: 360px; padding: 1.5rem 2rem; min-height: 100vh; }
        .lesson-panel { max-width: 950px; margin: 0 auto; }
        .lesson-panel h2 { font-size: 1.8rem; font-weight: 600; margin-bottom: 0.3rem; color: #ffd866; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
        .lesson-panel h2 i { color: #4b9eff; }
        .lesson-meta { color: #7a94b0; font-size: 0.9rem; margin-bottom: 1.5rem; border-bottom: 1px solid #25303d; padding-bottom: 0.6rem; }
        .lesson-content { font-size: 1.05rem; line-height: 2.3; color: #d4deec; }
        .lesson-content p { margin: 1.1rem 0; }
        .lesson-content strong { color: #ffd866; }
        .lesson-content em { color: #b7d0ea; font-style: italic; }
        .lesson-content code { background: #1a2533; padding: 0.15rem 0.55rem; border-radius: 6px; font-family: 'Consolas', 'Courier New', monospace; font-size: 0.92rem; color: #ffd866; direction: ltr; display: inline-block; }
        .lesson-content ul, .lesson-content ol { padding-right: 1.5rem; margin: 0.8rem 0; }
        .lesson-content ul li { margin: 0.4rem 0; list-style-type: none; }
        .lesson-content ul li::before { content: "▸ "; color: #4b9eff; }
        .lesson-content ol { list-style: decimal; }
        .lesson-content ol li { margin: 0.4rem 0; color: #b7cbe5; }
        
        .tip-box { background: #1a2533; padding: 1rem 1.5rem; border-radius: 12px; border: 1px solid #2a3a4a; margin: 1.5rem 0; display: flex; gap: 0.8rem; align-items: flex-start; }
        .tip-box i { color: #ffd866; font-size: 1.4rem; margin-top: 0.2rem; flex-shrink: 0; }
        .tip-box.warning { border-color: #5a3a2a; background: #2a1a1a; }
        .tip-box.warning i { color: #ff6b6b; }
        .tip-box.info { border-color: #2a3a5a; background: #1a253a; }
        .tip-box.info i { color: #4b9eff; }
        
        .code-block { background: #0f1820; border: 1px solid #1a2a3a; border-radius: 10px; padding: 1.2rem; margin: 1rem 0; overflow-x: auto; direction: ltr; text-align: left; font-family: 'Consolas', 'Courier New', monospace; font-size: 0.92rem; color: #b7d0ea; white-space: pre-wrap; line-height: 1.8; }
        .code-block .comment { color: #5a7a8a; }
        .code-block .keyword { color: #ff79c6; }
        .code-block .string { color: #f1fa8c; }
        .code-block .number { color: #bd93f9; }
        .code-block .function { color: #50fa7b; }
        .code-block .builtin { color: #8be9fd; }
        
        .data-table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; direction: rtl; }
        .data-table th { background: #1a2a3a; color: #ffd866; padding: 0.7rem 0.9rem; border: 1px solid #2a3a4a; font-weight: 600; text-align: right; }
        .data-table td { padding: 0.7rem 0.9rem; border: 1px solid #1a2a3a; background: #0f1820; color: #b7d0ea; }
        .data-table td.ltr { direction: ltr; text-align: left; font-family: 'Consolas', monospace; }
        .data-table tr:hover td { background: #1a2533; }
        .data-table .keyword-td { color: #ff79c6; }
        .data-table .string-td { color: #f1fa8c; }
        .data-table .number-td { color: #bd93f9; }
        .data-table .type-name { color: #8be9fd; font-weight: 600; }
        
        .nav-buttons { display: flex; gap: 1rem; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #1a2a3a; flex-wrap: wrap; }
        .nav-buttons button { background: #1a2533; border: 1px solid #2a3a4a; color: #b7cbe5; padding: 0.5rem 1.5rem; border-radius: 30px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .nav-buttons button:hover:not(:disabled) { background: #2a3a4a; border-color: #4b9eff; }
        .nav-buttons button:disabled { opacity: 0.3; cursor: not-allowed; }
        .footer { text-align: center; font-size: 0.7rem; color: #4a5a6a; padding: 1.5rem; border-top: 1px solid #1a2a3a; margin-top: 2rem; }
        
        h3.section-title { color: #ffd866; margin: 2rem 0 0.8rem 0; font-size: 1.3rem; border-bottom: 2px solid #1a2a3a; padding-bottom: 0.4rem; display: flex; align-items: center; gap: 0.5rem; }
        h3.section-title i { color: #4b9eff; font-size: 1.1rem; }
        h4.sub-title { color: #6eb5ff; margin: 1.3rem 0 0.5rem 0; font-size: 1.05rem; }
        
        .example-box { background: #0f1820; border-right: 3px solid #4b9eff; border-radius: 8px; padding: 1rem 1.2rem; margin: 1rem 0; }
        .example-box .label { color: #4b9eff; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.4rem; }
        .example-box .output { background: #0a121a; border-radius: 6px; padding: 0.6rem 0.8rem; margin-top: 0.5rem; font-family: 'Consolas', monospace; font-size: 0.85rem; color: #81c995; direction: ltr; text-align: left; }
        
        .lesson-library-section { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 2px solid #1a2a3a; }
        .lesson-library-section .section-header { color: #6eb5ff; font-size: 1.1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .lesson-library-section .section-header i { color: #4b9eff; }
        .library-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.8rem; }
        .library-card { background: #0f1820; border: 1px solid #1a2a3a; border-radius: 12px; padding: 0.9rem 1rem; transition: 0.2s; }
        .library-card:hover { border-color: #2a3a4a; background: #1a2533; transform: translateY(-2px); }
        .library-card .lib-card-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
        .library-card .lib-card-name { color: #ffd866; font-weight: 700; font-size: 0.95rem; direction: ltr; }
        .library-card .lib-card-cat { font-size: 0.55rem; padding: 0.1rem 0.5rem; border-radius: 10px; background: #1a2a3a; color: #4b9eff; margin-right: auto; }
        .library-card .lib-card-desc { color: #a7b7c7; font-size: 0.78rem; line-height: 1.7; margin-bottom: 0.4rem; }
        .library-card .lib-card-usage { color: #81c995; font-size: 0.7rem; background: #0a1815; padding: 0.4rem 0.6rem; border-radius: 6px; direction: ltr; text-align: left; font-family: 'Consolas', monospace; }
        .library-card .lib-card-note { color: #6a8aa8; font-size: 0.68rem; margin-top: 0.4rem; padding-top: 0.4rem; border-top: 1px solid #1a2a3a; }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0a121a; }
        ::-webkit-scrollbar-thumb { background: #2a3a4a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a4a5a; }
        
        @media (max-width: 768px) {
            .sidebar-toggle { display: block; }
            .sidebar { width: 320px; }
            .sidebar.closed { transform: translateX(100%); }
            .sidebar-close { display: block; }
            .main-content { margin-right: 0; padding: 1rem; }
            .header { padding: 0.8rem 1rem; }
            .lesson-panel h2 { font-size: 1.4rem; }
            .data-table { font-size: 0.85rem; }
            .data-table th, .data-table td { padding: 0.5rem 0.6rem; }
            .library-cards-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .sidebar { width: 290px; }
            .main-content { padding: 0.8rem; }
            .badge { font-size: 0.6rem; padding: 0.2rem 0.6rem; }
            .data-table { font-size: 0.75rem; }
            .data-table th, .data-table td { padding: 0.4rem 0.5rem; }
        }
    </style>
</head>
<body>

<header class="header">
    <div style="display:flex;align-items:center;gap:1rem;">
        <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <div class="logo"><i class="fab fa-python"></i><span>پایتون‌آموز · فصل اول</span></div>
    </div>
    <div class="badge">
        <i class="fas fa-graduation-cap"></i> فصل اول: ۱۰ درس
        <span class="lib-count"><i class="fas fa-cubes"></i> ۲۰۰ کتابخانه</span>
    </div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<aside class="sidebar closed" id="sidebar">
    <button class="sidebar-close" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
    <h3><i class="fas fa-list-ul"></i> فهرست</h3>
    <div class="sidebar-tabs">
        <button class="active" onclick="switchSidebarTab('lessons')"><i class="fas fa-book"></i> درس‌ها</button>
        <button onclick="switchSidebarTab('library')"><i class="fas fa-cubes"></i> گنجینه</button>
    </div>
    <input class="sidebar-search" id="sidebarSearch" placeholder="🔍 جستجو..." oninput="filterSidebar()">
    <div class="lesson-list" id="lessonList"></div>
    <div class="library-list" id="libraryList" style="display:none;">
        <div class="lib-search-box">
            <input id="libSearch" placeholder="جستجوی کتابخانه..." oninput="filterLibrary()">
            <select id="libCategory" onchange="filterLibrary()">
                <option value="all">همه</option>
                <option value="استاندارد">استاندارد</option>
                <option value="علمی">علمی</option>
                <option value="وب">وب</option>
                <option value="GUI">GUI</option>
                <option value="ابزار">ابزار</option>
                <option value="شبکه">شبکه</option>
            </select>
        </div>
        <div class="lib-stats">نمایش <span id="libCount">200</span> کتابخانه</div>
        <div id="libraryItems" style="flex:1;overflow-y:auto;"></div>
    </div>
    <div class="sidebar-footer">فصل اول: ۱۰ درس جامع + گنجینه</div>
</aside>

<main class="main-content">
    <div class="lesson-panel">
        <h2 id="lessonTitle"><i class="fas fa-book"></i> درس ۱</h2>
        <div class="lesson-meta" id="lessonMeta">مفاهیم پایه</div>
        <div class="lesson-content" id="lessonContent"></div>
        <div class="nav-buttons">
            <button onclick="prevLesson()" id="prevBtn"><i class="fas fa-chevron-right"></i> درس قبلی</button>
            <button onclick="nextLesson()" id="nextBtn">درس بعدی <i class="fas fa-chevron-left"></i></button>
        </div>
    </div>
    <footer class="footer">تمامی حقوق برای تیم‌های سامنوویکس و گام اول محفوظ است</footer>
</main>

<script>
// ============================================================
// گنجینه کتابخانه‌ها
// ============================================================
const libraries = [
    {name:"os", cat:"استاندارد", desc:"سیستم عامل - کار با فایل‌ها، پوشه‌ها، مسیرها و متغیرهای محیطی. تقریباً همه برنامه‌های پایتون از این ماژول استفاده می‌کنند.", usage:`os.getcwd()  # مسیر فعلی\nos.listdir()  # لیست فایل‌ها`},
    {name:"sys", cat:"استاندارد", desc:"سیستم و مفسر - دسترسی به آرگومان‌های خط فرمان، نسخه پایتون و مسیرهای جستجو.", usage:`sys.argv  # آرگومان‌ها\nsys.version  # نسخه`},
    {name:"datetime", cat:"استاندارد", desc:"تاریخ و زمان - کار با تاریخ، ساعت، تفاوت زمانی و فرمت‌های مختلف.", usage:`datetime.now()\ndatetime(2024, 1, 15)`},
    {name:"math", cat:"استاندارد", desc:"توابع ریاضی - ریشه دوم، توابع مثلثاتی، لگاریتم، فاکتوریل و ثابت‌های ریاضی.", usage:`math.sqrt(16)  # 4.0\nmath.pi  # 3.14159`},
    {name:"random", cat:"استاندارد", desc:"اعداد تصادفی - تولید اعداد تصادفی، انتخاب تصادفی و به‌هم‌ریختن ترتیب.", usage:`random.randint(1, 10)\nrandom.choice(list)`},
    {name:"json", cat:"استاندارد", desc:"JSON - ذخیره و انتقال داده به فرمت JSON (استاندارد وب). برای APIها ضروری است.", usage:`json.dumps({"a": 1})\njson.loads('{"a": 1}')`},
    {name:"re", cat:"استاندارد", desc:"عبارات با قاعده - جستجو، تطابق و جایگزینی الگوهای متنی پیچیده.", usage:`re.search(r'\\d+', text)\nre.findall(r'\\w+', text)`},
    {name:"collections", cat:"استاندارد", desc:"ساختارهای داده پیشرفته - Counter، defaultdict، deque، namedtuple.", usage:`Counter([1,1,2])  # {1:2, 2:1}\ndeque([1,2,3])`},
    {name:"itertools", cat:"استاندارد", desc:"ابزارهای تکرار - ترکیب، جایگشت، زنجیر و تکرار بی‌نهایت.", usage:`chain([1],[2])  # [1,2]\nproduct('AB', repeat=2)`},
    {name:"functools", cat:"استاندارد", desc:"توابع پیشرفته - کش کردن (lru_cache)، partial، reduce و decorator.", usage:`@lru_cache\ndef fib(n): ...`},
    {name:"typing", cat:"استاندارد", desc:"Type Hints - نوع‌دهی ایستا برای خوانایی و ابزارهای تحلیل کد.", usage:`def greet(name: str) -> str:\n    return f"Hi {name}"`},
    {name:"unittest", cat:"استاندارد", desc:"تست‌نویسی - چارچوب تست داخلی پایتون برای نوشتن تست‌های واحد.", usage:`class TestX(unittest.TestCase):\n    def test_add(self): ...`},
    {name:"logging", cat:"استاندارد", desc:"لاگ‌گیری - ثبت رویدادها با سطوح مختلف (DEBUG, INFO, WARNING, ERROR).", usage:`logging.info("پیام")\nlogging.error("خطا")`},
    {name:"argparse", cat:"استاندارد", desc:"پارس آرگومان - پردازش آرگومان‌های خط فرمان برای ابزارهای CLI.", usage:`parser.add_argument('--name')`},
    {name:"subprocess", cat:"استاندارد", desc:"فرآیندها - اجرای دستورات سیستمی و مدیریت فرآیندهای خارجی.", usage:`subprocess.run(['ls', '-la'])`},
    {name:"threading", cat:"استاندارد", desc:"چندنخی - اجرای همزمان چند کار با نخ‌ها (مناسب I/O).", usage:`Thread(target=func).start()`},
    {name:"multiprocessing", cat:"استاندارد", desc:"چندپردازشی - پردازش موازی با فرآیندها (مناسب CPU).", usage:`Pool(4).map(func, items)`},
    {name:"socket", cat:"استاندارد", desc:"شبکه - پیاده‌سازی ارتباطات شبکه با TCP/UDP.", usage:`socket.socket(AF_INET, SOCK_STREAM)`},
    {name:"http", cat:"استاندارد", desc:"HTTP - کار با پروتکل HTTP، سرور و کلاینت.", usage:`http.server.HTTPServer(...)`},
    {name:"urllib", cat:"استاندارد", desc:"URL - کار با URLها، درخواست‌های وب و پارس آدرس.", usage:`urllib.request.urlopen(url)`},

                        <td class="ltr">b" "</td>
                        <td class="ltr">b"hello"</td>
                        <td>داده‌های باینری</td>
                    </tr>
                </tbody>
            </table>

            <h4 class="sub-title">کاراکترهای ویژه (Escape Sequences):</h4>
            <table class="data-table">
                <thead>
                    <tr><th>کاراکتر</th><th>توضیح</th><th>مثال</th><th>خروجی</th></tr>
                </thead>
                <tbody>
                    <tr><td class="ltr">\\n</td><td>خط جدید</td><td class="ltr">"سلام\\nدنیا"</td><td class="ltr">سلام<br>دنیا</td></tr>
                    <tr><td class="ltr">\\t</td><td>Tab (پرش)</td><td class="ltr">"سلام\\tدنیا"</td><td class="ltr">سلام&nbsp;&nbsp;&nbsp;&nbsp;دنیا</td></tr>
                    <tr><td class="ltr">\\\\</td><td>بک‌اسلش</td><td class="ltr">"C:\\\\Users"</td><td class="ltr">C:\\Users</td></tr>

                    <tr><td class="ltr">\\"</td><td>کوتیشن دوتا</td><td class="ltr">"say \\"hi\\""</td><td class="ltr">say "hi"</td></tr>
                    <tr><td class="ltr">\\r</td><td>بازگشت به ابتدای خط</td><td class="ltr">"سلام\\rدنیا"</td><td class="ltr">دنیا</td></tr>
                </tbody>
            </table>

            <h4 class="sub-title">عملیات روی رشته‌ها:</h4>
            <div class="code-block">first = <span class="string">"سلام"</span>
second = <span class="string">"دنیا"</span>

<span class="comment"># اتصال (Concatenation)</span>
<span class="builtin">print</span>(first + <span class="string">" "</span> + second)  <span class="comment"># سلام دنیا</span>

<span class="comment"># تکرار (Repetition)</span>
<span class="builtin">print</span>(<span class="string">"="</span> * <span class="number">10</span>)  <span class="comment"># ==========</span>

<span class="comment"># طول رشته</span>
<span class="builtin">print</span>(<span class="builtin">len</span>(first))  <span class="comment"># 4</span>

<span class="comment"># دسترسی به کاراکتر (Indexing)</span>
word = <span class="string">"Python"</span>
<span class="builtin">print</span>(word[<span class="number">0</span>])   <span class="comment"># P</span>
<span class="builtin">print</span>(word[-<span class="number">1</span>])  <span class="comment"># n (آخرین کاراکتر)</span>

<span class="comment"># برش (Slicing)</span>
<span class="builtin">print</span>(word[<span class="number">1</span>:<span class="number">4</span>])  <span class="comment"># yth</span>

            <h3 class="section-title"><i class="fas fa-check-double"></i> ۴. مقادیر منطقی (bool)</h3>
            <p>نوع داده <code>bool</code> فقط دو مقدار دارد: <code>True</code> (درست) و <code>False</code> (نادرست). این مقادیر معمولاً نتیجه <strong>عملیات مقایسه‌ای</strong> یا <strong>منطقی</strong> هستند.</p>
            <div class="code-block">is_student = <span class="keyword">True</span>
is_teacher = <span class="keyword">False</span>

<span class="comment"># عملیات مقایسه‌ای</span>
<span class="builtin">print</span>(<span class="number">5</span> > <span class="number">3</span>)   <span class="comment"># True</span>
<span class="builtin">print</span>(<span class="number">5</span> == <span class="number">5</span>)  <span class="comment"># True</span>
<span class="builtin">print</span>(<span class="number">5</span> != <span class="number">5</span>)  <span class="comment"># False</span>

<span class="comment"># تبدیل به bool</span>
<span class="builtin">print</span>(<span class="builtin">bool</span>(<span class="number">0</span>))     <span class="comment"># False</span>
<span class="builtin">print</span>(<span class="builtin">bool</span>(<span class="number">1</span>))     <span class="comment"># True</span>
<span class="builtin">print</span>(<span class="builtin">bool</span>(<span class="string">""</span>))    <span class="comment"># False (رشته خالی)</span>
<span class="builtin">print</span>(<span class="builtin">bool</span>(<span class="string">"سلام"</span>)) <span class="comment"># True</span></div>
            
            <div class="tip-box info">
                <i class="fas fa-info-circle"></i>
                <div><strong>مقادیر Falsy در پایتون:</strong> مقادیری که در بستر منطقی <code>False</code> در نظر گرفته می‌شوند عبارتند از: <code>False</code>، <code>None</code>، <code>0</code>، <code>0.0</code>، <code>""</code>، <code>[]</code>، <code>()</code>، <code>{}</code> و <code>set()</code>. بقیه مقادیر <code>True</code> هستند.</div>
            </div>

            <h3 class="section-title"><i class="fas fa-ban"></i> ۵. مقدار None (NoneType)</h3>
            <p><code>None</code> در پایتون به معنای <strong>"هیچ مقداری"</strong> یا <strong>"عدم وجود مقدار"</strong> است. این مقدار معادل <code>null</code> در سایر زبان‌ها است و معمولاً برای:</p>
            <ul>
                <li>مقداردهی اولیه به متغیرها</li>
                <li>مشخص کردن عدم بازگشت مقدار از یک تابع</li>
                <li>پارامترهای پیش‌فرض توابع</li>
            </ul>
            <div class="code-block">result = <span class="keyword">None</span>
<span class="builtin">print</span>(result)  <span class="comment"># None</span>
<span class="builtin">print</span>(<span class="builtin">type</span>(result))  <span class="comment"># &lt;class 'NoneType'&gt;</span>

<span class="comment"># بررسی None</span>
<span class="keyword">if</span> result <span class="keyword">is</span> <span class="keyword">None</span>:
    <span class="builtin">print</span>(<span class="string">"مقداری وجود ندارد"</span>)</div>

            <h3 class="section-title"><i class="fas fa-tag"></i> قوانین نام‌گذاری متغیرها</h3>
            <p>در پایتون، برای نام‌گذاری متغیرها قوانین مشخصی وجود دارد:</p>
            <ul>
                <li>نام می‌تواند شامل حروف (a-z, A-Z)، اعداد (0-9) و زیرخط (_) باشد</li>
                <li>نام باید با حرف یا زیرخط شروع شود (نه با عدد)</li>
                <li>نام نمی‌تواند شامل فاصله یا کاراکترهای ویژه باشد</li>
                <li>نام‌ها به حروف بزرگ و کوچک حساس هستند (<code>name</code> ≠ <code>Name</code>)</li>
                <li>از کلمات کلیدی پایتون (Keywords) نمی‌توان به عنوان نام استفاده کرد</li>
            </ul>
            
            <h4 class="sub-title">کلمات کلیدی پایتون (Keywords):</h4>
            <div class="code-block"><span class="keyword">False</span>    <span class="keyword">None</span>     <span class="keyword">True</span>     <span class="keyword">and</span>      <span class="keyword">as</span>       <span class="keyword">assert</span>
<span class="keyword">async</span>    <span class="keyword">await</span>    <span class="keyword">break</span>    <span class="keyword">class</span>    <span class="keyword">continue</span> <span class="keyword">def</span>
<span class="keyword">del</span>      <span class="keyword">elif</span>     <span class="keyword">else</span>     <span class="keyword">except</span>   <span class="keyword">finally</span>  <span class="keyword">for</span>
<span class="keyword">from</span>     <span class="keyword">global</span>   <span class="keyword">if</span>       <span class="keyword">import</span>   <span class="keyword">in</span>       <span class="keyword">is</span>
<span class="keyword">lambda</span>   <span class="keyword">nonlocal</span> <span class="keyword">not</span>      <span class="keyword">or</span>       <span class="keyword">pass</span>     <span class="keyword">raise</span>
<span class="keyword">return</span>   <span class="keyword">try</span>      <span class="keyword">while</span>    <span class="keyword">with</span>     <span class="keyword">yield</span></div>

            <h3 class="section-title"><i class="fas fa-search"></i> تابع type() و isinstance()</h3>
            <p>برای بررسی نوع داده یک متغیر، از تابع <code>type()</code> استفاده می‌کنیم:</p>

<span class="comment"># بررسی نوع با isinstance</span>

<span class="builtin">print</span>(<span class="builtin">bool</span>(<span class="number">1</span>))      <span class="comment"># True</span></div>

        <span class="keyword">return</span> <span class="number">1</span>

        <span class="keyword">return</span> n
    <span class="keyword">return</span> fibonacci(n-<span class="number">1</span>) + fibonacci(n-<span class="number">2</span>)

        code: `# توابع در پایتون\n# تابع ساده\ndef greet(name):\n    """تابع خوش‌آمدگویی"""\n    return f"سلام {name}!"\n\nprint(greet("علی"))\nprint(greet("سارا"))\n\n# تابع با پارامتر پیش‌فرض\ndef power(base, exp=2):\n    return base ** exp\n\nprint(f"\\n5 به توان 2: {power(5)}")\nprint(f"5 به توان 3: {power(5, 3)}")\n\n# تابع با *args\ndef sum_all(*numbers):\n    return sum(numbers)\n\nprint(f"\\nجمع 1,2,3: {sum_all(1, 2, 3)}")\nprint(f"جمع 1,2,3,4,5: {sum_all(1, 2, 3, 4, 5)}")\n\n# تابع بازگشتی\ndef factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\n\nprint(f"\\n5 فاکتوریل: {factorial(5)}")\n\n# lambda\nsquare = lambda x: x ** 2\nnumbers = [1, 2, 3, 4, 5]\nsquared = list(map(square, numbers))\nprint(f"\\nمربع اعداد: {squared}")`,
        output: `سلام علی!\nسلام سارا!\n\n5 به توان 2: 25\n5 به توان 3: 125\n\nجمع 1,2,3: 6\nجمع 1,2,3,4,5: 15\n\n5 فاکتوریل: 120\n\nمربع اعداد: [1, 4, 9, 16, 25]`
    }
];

// ============================================================
// کتابخانه‌های مرتبط با هر درس
// ============================================================
function getRelatedLibraries(lessonId) {
    const map = {
        1: ['sys', 'platform', 'os'],
        2: ['typing', 'dataclasses', 'enum'],
        3: ['sys', 'io', 'argparse'],
        4: ['math', 'random', 'statistics'],
        5: ['enum', 'typing'],
        6: ['itertools', 'collections'],
        7: ['itertools', 'random'],
        8: ['collections', 'array', 'bisect', 'heapq'],
        9: ['collections', 'typing', 'dataclasses'],
        10: ['functools', 'typing', 'inspect']
    };
    const ids = map[lessonId] || [];
    return libraries.filter(lib => ids.includes(lib.name));
}

// ============================================================
// منطق برنامه
// ============================================================
let currentLessonId = 1;
let currentTab = 'lessons';

function renderLessonList(filter = '') {
    const list = document.getElementById('lessonList');
    if (!list) return;
    list.innerHTML = '';
    const query = filter.toLowerCase().trim();
    
    lessons.forEach(lesson => {
        const match = lesson.title.toLowerCase().includes(query) || 
                      lesson.meta.toLowerCase().includes(query);
        if (query !== '' && !match) return;
        
        const btn = document.createElement('button');
        btn.className = 'lesson-item' + (lesson.id === currentLessonId ? ' active' : '');
        btn.dataset.id = lesson.id;
        btn.innerHTML = `
            <i class="fas fa-book"></i>
            درس ${lesson.id} · ${lesson.title}
            <span class="num">${lesson.id}</span>
        `;
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            loadLesson(lesson.id);
            if (window.innerWidth <= 768) toggleSidebar();
        });
        list.appendChild(btn);
    });
}

function renderLibraryList(filter = '', category = 'all') {
    const container = document.getElementById('libraryItems');
    if (!container) return;
    const query = filter.toLowerCase().trim();
    let html = '';
    let count = 0;
    libraries.forEach(lib => {
        const matchCat = category === 'all' || lib.cat === category;
        const matchName = lib.name.toLowerCase().includes(query);
        const matchDesc = lib.desc.toLowerCase().includes(query);
        if (matchCat && (matchName || matchDesc || query === '')) {
            count++;
            html += `
                <div class="library-item">
                    <div class="lib-header-row">
                        <span class="lib-name">${lib.name}</span>
                        <span class="lib-cat">${lib.cat}</span>
                    </div>
                    <div class="lib-desc">${lib.desc}</div>
                    ${lib.usage ? `<div class="lib-usage">${lib.usage.replace(/\n/g, '<br>')}</div>` : ''}
                </div>
            `;
        }
    });
    container.innerHTML = html || '<div style="color:#6a8aa8;text-align:center;padding:1rem;">کتابخانه‌ای یافت نشد</div>';
    document.getElementById('libCount').textContent = count;
}

function filterLibrary() {
    const search = document.getElementById('libSearch');
    const cat = document.getElementById('libCategory');
    renderLibraryList(search ? search.value : '', cat ? cat.value : 'all');
}

function switchSidebarTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.sidebar-tabs button').forEach(b => b.classList.remove('active'));
    const tabs = document.querySelectorAll('.sidebar-tabs button');
    if (tab === 'lessons') {
        tabs[0].classList.add('active');
        document.getElementById('lessonList').style.display = 'flex';
        document.getElementById('libraryList').style.display = 'none';
        document.getElementById('sidebarSearch').style.display = 'block';
        document.querySelector('.sidebar-footer').textContent = 'فصل اول: ۱۰ درس جامع';
    } else {
        tabs[1].classList.add('active');
        document.getElementById('lessonList').style.display = 'none';
        document.getElementById('libraryList').style.display = 'flex';
        document.getElementById('sidebarSearch').style.display = 'none';
        document.querySelector('.sidebar-footer').textContent = '۲۰۰ کتابخانه';
        renderLibraryList();
    }
}

function filterSidebar() {
    const search = document.getElementById('sidebarSearch');
    if (currentTab === 'lessons') {
        renderLessonList(search ? search.value : '');
    }
}

function loadLesson(id) {
    const lesson = lessons.find(l => l.id === id);
    if (!lesson) return;
    currentLessonId = id;
    document.getElementById('lessonTitle').innerHTML = `<i class="fas fa-book"></i> درس ${lesson.id} · ${lesson.title}`;
    document.getElementById('lessonMeta').textContent = lesson.meta;
    
    // کتابخانه‌های مرتبط
    const relatedLibs = getRelatedLibraries(id);
    let libHTML = '';
    if (relatedLibs.length > 0) {
        libHTML = `
            <div class="lesson-library-section">
                <div class="section-header">
                    <i class="fas fa-cubes"></i>
                    کتابخانه‌های مرتبط با این درس
                </div>
                <div class="library-cards-grid">
                    ${relatedLibs.map(lib => `
                        <div class="library-card">
                            <div class="lib-card-header">
                                <span class="lib-card-name">${lib.name}</span>
                                <span class="lib-card-cat">${lib.cat}</span>
                            </div>
                            <div class="lib-card-desc">${lib.desc}</div>
                            ${lib.usage ? `<div class="lib-card-usage">${lib.usage.replace(/\n/g, '<br>')}</div>` : ''}
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }
    
    document.getElementById('lessonContent').innerHTML = lesson.content + libHTML;
    document.querySelectorAll('.lesson-item').forEach(el => {
        el.classList.remove('active');
        if (parseInt(el.dataset.id) === id) el.classList.add('active');
    });
    document.getElementById('prevBtn').disabled = id <= 1;
    document.getElementById('nextBtn').disabled = id >= lessons.length;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextLesson() {
    if (currentLessonId < lessons.length) loadLesson(currentLessonId + 1);
}

function prevLesson() {
    if (currentLessonId > 1) loadLesson(currentLessonId - 1);
}

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    sidebar.classList.toggle('closed');
    overlay.classList.toggle('open');
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' && !e.shiftKey) { e.preventDefault(); nextLesson(); }
    if (e.key === 'ArrowLeft' && !e.shiftKey) { e.preventDefault(); prevLesson(); }
    if (e.key === 'Escape' && window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.add('closed');
        document.getElementById('sidebarOverlay').classList.remove('open');
    }
});

renderLessonList();
loadLesson(1);
</script>
</body>
</html>
